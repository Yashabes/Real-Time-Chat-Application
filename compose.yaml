version: "3.9"
services:
  db:
    image: mysql:8.0
    container_name: realtimechat-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Virendra@123"
      MYSQL_DATABASE: "RealTimeChatApp"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: realtimechat-backend
    ports:
      - "8081:8081" # backend runs on 8081
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/RealTimeChatApp
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Virendra@123"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SERVER_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: realtimechat-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - appnet

volumes:
  db_data: {}

networks:
  appnet:
    driver: bridge

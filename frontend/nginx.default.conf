server {
    listen 80;
    server_name _;

    # Serve built SPA
    root /usr/share/nginx/html;
    index index.html;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket endpoint
    location /ws {
        proxy_pass http://backend:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # API reverse proxy (covers /api and auth/chat endpoints)
    location /api/ {
        proxy_pass http://backend:8081/api/;
    }

    location /auth/ {
        proxy_pass http://backend:8081/auth/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip for common types
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript image/svg+xml;
}
